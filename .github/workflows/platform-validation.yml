name: Native platform validation

# Explicit dispatch only. This workflow never publishes release assets.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-platform-validation-${{ github.repository }}
  cancel-in-progress: false

jobs:
  macos-arm64:
    # Standard public-repository runners are free; do not run on a private copy.
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Validate the exact macOS package with native Blender 5.2.3
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -B scripts/ci_platform_validation.py --output "$RUNNER_TEMP/sith-platform-validation"
      - name: Retain package, receipts and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos-arm64-blender-5.2.3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sith-platform-validation/evidence/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
